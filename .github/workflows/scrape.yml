name: Tartalom leszedése (magveto.hu)
on:
  workflow_dispatch:
    inputs:
      works:
        description: "none | scope | all"
        default: "scope"
      list_size:
        default: "50"
      press:
        default: "50"
      only_categories:
        description: "true = csak a kategória-címkék frissítése"
        default: "false"
      cat_pages:
        default: "3"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 pillow
      - run: |
          if [ "${{ inputs.only_categories }}" = "true" ]; then
            python scraper/scrape.py --only-categories --cat-pages "${{ inputs.cat_pages }}"
          else
            python scraper/scrape.py --works "${{ inputs.works }}" --list-size "${{ inputs.list_size }}" --press "${{ inputs.press }}" --cat-pages "${{ inputs.cat_pages }}"
          fi
      - name: Commit
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content public/media brand/source; [ -f scraper/raw.tar.gz ] && git add scraper/raw.tar.gz
          git commit -m "content: snapshot magveto.hu ($(date -u +%F))" || echo "nincs változás"
          git push
